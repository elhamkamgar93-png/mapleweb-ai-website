name: MapleWeb Publishing Agent
# Manual trigger only: avoids consuming Actions minutes on every commit.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mapleweb-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Check website source
        run: |
          test -s index.html || { echo "::error::index.html is missing"; exit 1; }
          grep -qi '<html' index.html || { echo "::error::index.html is not HTML"; exit 1; }
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --silent --show-error --max-time 20 "$URL" -o /tmp/home.html && grep -qi 'MapleWeb' /tmp/home.html; then
              echo "Verified live website: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published URL did not pass verification"
          exit 1
