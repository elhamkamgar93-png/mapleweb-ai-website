name: MapleWeb Publishing Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/publishing-agent.yml'
permissions:
  contents: read
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials are configured
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Publishing is not enabled. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Actions repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify website assets
        run: |
          test -s public/index.html
          test -s wrangler.jsonc
      - name: Publish to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Record deployment
        if: success()
        run: |
          echo "### MapleWeb Publishing Agent" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Wrangler deployment completed for commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Confirm that the workers.dev route is enabled and test the public website URL separately." >> "$GITHUB_STEP_SUMMARY"
